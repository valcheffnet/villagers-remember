plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'villagers-remember'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"villagersremember" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "villagersremember-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: Mod Menu shows the settings button. Not bundled, not required.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Optional: Waystones (BlayTheNinth) names village waystones after the village. Compiled against, never bundled.
	compileOnly "maven.modrinth:waystones:${project.waystones_version}"
	compileOnly "maven.modrinth:balm:${project.balm_version}"
	// The game test runs with Waystones to check the real naming; it is never part of the mod.
	gametestCompileOnly "maven.modrinth:waystones:${project.waystones_version}"
	gametestCompileOnly "maven.modrinth:balm:${project.balm_version}"
	gametestRuntimeOnly "maven.modrinth:waystones:${project.waystones_version}"
	gametestRuntimeOnly "maven.modrinth:balm:${project.balm_version}"
	gametestRuntimeOnly "maven.modrinth:shogi:${project.shogi_version}"
	// RightClickHarvest (our server has it): harvests that replant instead of breaking must count.
	gametestRuntimeOnly "maven.modrinth:rightclickharvest:${project.rightclickharvest_version}"
	gametestRuntimeOnly "maven.modrinth:jamlib:${project.jamlib_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

def templateProps = [
	version          : project.version,
	minecraft_version: project.minecraft_version,
	java_version     : project.java_version,
]

processResources {
	inputs.properties templateProps
	filesMatching(["fabric.mod.json", "*.mixins.json"]) {
		expand templateProps
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	from("LICENSE.md") {
		rename { "LICENSE_villagers-remember.md" }
	}
}
